name: CI — CRM Luxia

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint, Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias Frontend
        run: npm ci

      - name: Verificar Lint / TypeScript
        run: npm run lint --if-present

      - name: Build de Producción Frontend
        run: npm run build

      - name: Instalar dependencias Backend
        run: cd server && npm ci

      - name: Verificar sintaxis Backend
        run: |
          cd server
          node -c index.js
          node -c routes/callables.js
          node -c routes/api.js
          node -c utils/sanitize.js

  security-scan:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auditoría de paquetes Frontend (High+)
        run: npm audit --audit-level=high

      - name: Auditoría de paquetes Backend (High+)
        run: cd server && npm audit --audit-level=high
