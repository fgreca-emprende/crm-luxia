name: CRM-Luxia Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  audit_and_test:
    name: Build, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project & Server Dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Run ESLint Verification
        run: npm run lint

      - name: Audit Dependencies for Vulnerabilities
        run: npm audit --audit-level=high

      - name: Execute Vitest Test Suite
        env:
          VITE_SUPABASE_URL: 'http://localhost:8000'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.dummy'
        run: npm test
